[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-model-comparer"
version = "0.1.0"
description = "Local-first CLI to compare local LLM models side by side via an OpenAI-compatible endpoint (default Ollama). No API keys required."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Asdale Dynamics, LLC"}]
keywords = ["ollama", "llm", "local-ai", "cli", "comparison"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]

[project.scripts]
compare-cli = "model_comparer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.setuptools.packages.find]
where = ["src"]
include = ["model_comparer*"]
